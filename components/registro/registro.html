<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Qatu</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/isotipo-qatu-svg.svg"
    />
    <link rel="stylesheet" href="registro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <script type="module">
      import { mostrarAlerta, mostrarConfirmacion } from '/components/utils/alertas.js';
      window.mostrarAlerta = mostrarAlerta;
      window.mostrarConfirmacion = mostrarConfirmacion;
    </script>
    <script type="module" src="./js/registro.js" defer></script>
  </head>
  <body>
    <a href="/public/index.html" class="btn-volver">
      <img src="/assets/flecha-volver.svg" alt="Volver al inicio" />
    </a>
    <header>
      <div id="logo">
        <img src="/assets/isotipo-qatu-svg.svg" alt="Logotipo Qatu" />
      </div>
    </header>
    <main>
      <div class="registro-container">
        <h1>Registro</h1>
        
        <!-- Selector de tipo de usuario -->
        <div class="tipo-usuario-selector">
          <button type="button" id="btn-comprador" class="btn-tipo-usuario active" aria-pressed="true">
            Comprador
          </button>
          <button type="button" id="btn-vendedor" class="btn-tipo-usuario" aria-pressed="false">
            Vendedor
          </button>
        </div>

        <!-- Formulario para Comprador -->
        <form class="registro-form" id="form-comprador">
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre <span class="required">*</span></label>
              <input type="text" id="nombre" name="nombre" required aria-required="true" />
            </div>
            <div class="form-group">
              <label for="apellido">Apellido <span class="required">*</span></label>
              <input type="text" id="apellido" name="apellido" required aria-required="true" />
            </div>
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico <span class="required">*</span></label>
            <input type="email" id="email" name="email" required aria-required="true" />
          </div>
          <div class="form-group">
            <label for="password">Contraseña <span class="required">*</span></label>
            <input type="password" id="password" name="password" required aria-required="true" />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar Contraseña <span class="required">*</span></label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              aria-required="true"
            />
          </div>
          <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <!-- Formulario para Vendedor -->
        <form class="registro-form" id="form-vendedor" style="display: none;">
          <div class="form-group">
            <label for="nombre-empresa">Nombre de la Empresa <span class="required">*</span></label>
            <input type="text" id="nombre-empresa" name="nombre-empresa" required aria-required="true" />
          </div>
          <div class="form-group">
            <label for="email-vendedor">Correo Electrónico <span class="required">*</span></label>
            <input type="email" id="email-vendedor" name="email-vendedor" required aria-required="true" />
          </div>
          <div class="form-group">
            <label for="password-vendedor">Contraseña <span class="required">*</span></label>
            <input type="password" id="password-vendedor" name="password-vendedor" required aria-required="true" />
          </div>
          <div class="form-group">
            <label for="confirm-password-vendedor">Confirmar Contraseña <span class="required">*</span></label>
            <input
              type="password"
              id="confirm-password-vendedor"
              name="confirm-password-vendedor"
              required
              aria-required="true"
            />
          </div>
          <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <p class="login-link">
          ¿Ya tienes una cuenta? <a href="/components/login/login.html">Inicia sesión</a>
        </p>
      </div>
    </main>
  </body>
</html>
