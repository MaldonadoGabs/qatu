<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qatu</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/isotipo-qatu-svg.svg"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="../components/dashboard/js/dashboard.js" defer></script>
  </head>
  <body>
    <header>
      <div id="logo">
        <img src="../assets/logo-qatu-rojo.png" alt="Logotipo Qatu" />
      </div>
      <div id="login">
        <button class="btn-carrito" id="btn-carrito">
          <span class="carrito-count">0</span>
        </button>
        <button class="btn-login">
          Iniciar Sesión
        </button>
        <button class="btn-cerrar-sesion" id="btn-cerrar-sesion" style="display: none;">
          Cerrar Sesión
        </button>
      </div>
    </header>
    <nav>
      <div class="barra-navegacion">
        <ul>
          <li class="dropdown">
            Categorías
            <ul class="dropdown-menu">
              <li><a href="#">Electrónicos</a></li>
              <li><a href="#">Hogar</a></li>
              <li><a href="#">Ropa</a></li>
              <li><a href="#">Belleza</a></li>
              <li><a href="#">Deportes</a></li>
              <li><a href="#">Libros</a></li>
              <li><a href="#">Juguetes</a></li>
              <li><a href="#">Alimentos</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>
    <main>
      <section id="productos-recientes">
        <h2>Productos Recientes</h2>
        <button class="btn-prev">&larr;</button>
        <button class="btn-next">&rarr;</button>
      </section>
      <section id="mi-carrito">
        <h2>Mi Carrito</h2>
        <button class="btn-remove">&times;</button>
        <p>Tu carrito está vacío</p>
        <p>Total: $0.00</p>
        <button class="btn-finalizar">Finalizar Compra</button>
      </section>
    </main>
  </body>
</html>
